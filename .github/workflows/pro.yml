# Lumen Pro checks: protocol contract, gateway, (cloud from P1, mobile from P7).
# The firmware and web UI keep their own workflow (ci.yml).
name: Lumen Pro

on:
  push:
    branches: [lumen-pro]
  pull_request:
    branches: [lumen-pro]

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Fixtures are generated from make_fixtures.py
        run: |
          python3 protocol/tools/make_fixtures.py
          git diff --exit-code -- protocol/fixtures
      - run: npm run validate:schemas
      - run: python3 protocol/tools/ticket_ref.py

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: node scripts/third_party_notices.mjs --check

  gateway:
    name: Gateway (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-build (arm64, armv7, amd64)
        run: |
          for t in linux/arm64 linux/arm/7 linux/amd64; do
            IFS=/ read -r os arch arm <<< "$t"
            GOOS=$os GOARCH=$arch GOARM=$arm CGO_ENABLED=0 go build ./...
          done

  cloud:
    name: Cloud (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
          POSTGRES_DB: lumen_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumen" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.12-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run python tools/licenses.py --check
      # The broker tests skip here (no dev certificates / EMQX); they run locally against compose.
      - run: uv run pytest -q
      - name: Image builds
        run: docker build -t lumen-cloud:ci .
