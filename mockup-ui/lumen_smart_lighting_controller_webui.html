    function selectBoardCandidate(id) {
      state.activeBoardId = id;
      showToast('Candidate board profile loaded', 'default', 'Click "Validate & Apply Profile" to commit.');
      render();
    }

    function duplicateActiveBoard() {
      const bp = state.boardProfiles.find(b => b.id === state.activeBoardId);
      if (!bp) return;
      const copy = { ...bp, id: 'custom_' + Date.now(), name: bp.name + ' (Custom)', builtIn: false };
      state.boardProfiles.push(copy);
      state.activeBoardId = copy.id;
      showToast(`Created editable profile "${copy.name}"`, 'success');
      render();
    }

    function exportBoardJson() {
      const bp = state.boardProfiles.find(b => b.id === state.activeBoardId);
      state.modal = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal-panel">
            <h2 style="margin:0 0 8px;font-size:18px">Board Profile JSON (${escapeHtml(bp.id)})</h2>
            <textarea class="textarea font-mono" style="min-height:240px;font-size:12px" readonly>${escapeHtml(JSON.stringify({ schema_version: 1, ...bp, resources: state.gpioPins }, null, 2))}</textarea>
            <div style="display:flex;justify-content:flex-end;margin-top:12px">
              <button class="btn btn-primary" onclick="closeModal()">Close</button>
            </div>
          </div>
        </div>
      `;
      render();
    }

    function openPinAssignModal(gpio) {
      const pin = state.gpioPins.find(p => p.gpio === gpio);
      if (!pin) return;
      state.modal = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal-panel">
            <h2 style="margin:0 0 6px;font-size:18px">Configure GPIO ${pin.gpio}</h2>
            <p style="margin:0 0 14px;font-size:13px;color:var(--muted-foreground)">
              ${pin.dir === 'input-only' ? 'Hardware restriction: GPIO 34-39 on ESP32 are input-only without internal pull-ups.' : pin.strapping ? 'Warning: Boot strapping pin — ensure safe idle polarity.' : 'General purpose digital/peripheral GPIO.'}
            </p>
            <div style="display:flex;flex-direction:column;gap:12px">
              <div>
                <label class="label">Assigned Function</label>
                <select id="pin-role-sel" class="select">
                  <option value="${escapeHtml(pin.role)}">${escapeHtml(pin.role)} (Current)</option>
                  <option value="LEDC Native PWM">LEDC Native PWM</option>
                  <option value="RMT Addressable LED">RMT Addressable LED</option>
                  <option value="Digital Input">Digital Input</option>
                  <option value="I2C0 SDA">I2C0 SDA (Conflict Test)</option>
                  <option value="Unassigned">Unassigned</option>
                </select>
              </div>
              <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="savePinAssignment(${pin.gpio})">Update Pin</button>
              </div>
            </div>
          </div>
        </div>
      `;
      render();
    }

    function savePinAssignment(gpio) {
      const pin = state.gpioPins.find(p => p.gpio === gpio);
      const nextRole = document.getElementById('pin-role-sel').value;
      if (pin) {
        pin.role = nextRole;
        pin.dir = nextRole === 'Unassigned' ? 'free' : nextRole.includes('Input') ? 'input' : 'output';
        pin.conflict = (nextRole === 'I2C0 SDA' && gpio !== 4) || (pin.dir === 'input-only' && nextRole.includes('PWM'));
      }
      closeModal();
      runPinValidation();
    }

    function runPinValidation() {
      const conflicts = state.gpioPins.filter(p => p.conflict);
      if (conflicts.length) {
        showToast('Pin validation failed', 'error', `Conflict on GPIO ${conflicts.map(c => c.gpio).join(', ')}`);
      } else {
        showToast('POST /boards/validate passed', 'success', 'Zero GPIO, strapping, or peripheral conflicts.');
      }
      render();
    }

    function runI2cBusScan() {
      state.i2cScanning = true;
      render();
      setTimeout(() => {
        state.i2cScanning = false;
        state.i2cScanResults = ['0x21', '0x22', '0x40'];
        showToast('I2C Bus Scan Complete', 'default', 'Found 3 devices at 0x21, 0x22, 0x40.');
        render();
      }, 650);
    }

    function confirmPca9685Address() {
      state.pca9685AddressConfirmed = true;
      state.alerts = state.alerts.filter(a => a.id !== 'pca_addr');
      showToast('PCA9685 address 0x40 confirmed', 'success', 'Hardware driver initialized.');
      render();
    }

    function openApplyBoardConfirm() {
      state.modal = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">

      render();

      `;
    }

    function confirmNetworkSave() {
      state.modal = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal-panel">
            <h2 style="margin:0 0 8px;font-size:18px">Apply Network Settings?</h2>
            <p style="margin:0 0 16px;font-size:14px;color:var(--muted-foreground)">
              Updating Wi-Fi or IP parameters may temporarily drop your active WebSocket/HTTP session. Reconnect via <code>http://lumen.local</code> or your fallback AP if unreachable.
            </p>
            <div style="display:flex;justify-content:flex-end;gap:8px">
              <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
              <button class="btn btn-primary" onclick="closeModal();showToast('Network configuration saved','success')">Apply Settings</button>
            </div>
          </div>
        </div>
      `;
      render();
    }

    // ==========================================================================
    // SCREEN 11: SETTINGS (Section 7.11 — Account, Theme, Backup, OTA, System)
    // ==========================================================================
    function renderSettings() {
      return `
        <div style="display:flex;flex-direction:column;gap:20px">
          <div>
            <h1 style="margin:0;font-size:24px;font-weight:700">Settings</h1>
            <p style="margin:4px 0 0;font-size:14px;color:var(--muted-foreground)">
              Appearance, controller backup/restore, dual-partition OTA firmware updates, and system lifecycle
            </p>
          </div>

          <div class="grid-2">
            <!-- Appearance -->
            <div class="card" style="display:flex;flex-direction:column;gap:12px">
              <h3 style="margin:0;font-size:17px">Appearance</h3>
              <p style="margin:0;font-size:13px;color:var(--muted-foreground)">Select light, dark, or system-synchronized OKLCH theme tokens.</p>
              <div class="tabs-list">
                <button class="tab-trigger ${state.theme === 'light' ? 'active' : ''}" onclick="applyTheme('light')">Light</button>
                <button class="tab-trigger ${state.theme === 'dark' ? 'active' : ''}" onclick="applyTheme('dark')">Dark</button>
                <button class="tab-trigger ${state.theme === 'system' ? 'active' : ''}" onclick="applyTheme('system')">System</button>
              </div>
            </div>

            <!-- Account Security -->
            <div class="card" style="display:flex;flex-direction:column;gap:12px">
              <h3 style="margin:0;font-size:17px">Account &amp; Session</h3>
              <p style="margin:0;font-size:13px;color:var(--muted-foreground)">Single-user administrator session (HTTP-only cookie + CSRF token).</p>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn btn-secondary btn-sm" onclick="navigate('setup-password')">Change Password</button>
                <button class="btn btn-secondary btn-sm" onclick="navigate('login')">Sign Out</button>
              </div>
            </div>

            <!-- OTA Firmware Update (SPEC Section 20) -->
            <div class="card" style="display:flex;flex-direction:column;gap:12px">
              <div style="display:flex;align-items:center;justify-content:space-between">
                <h3 style="margin:0;font-size:17px">OTA Firmware Update</h3>
                <span class="badge badge-info">v1.2.0 Available</span>
              </div>
              <p style="margin:0;font-size:13px;color:var(--muted-foreground)">Dual OTA application partitions with signature &amp; rollback protection.</p>
              <div id="ota-progress-wrap" style="display:none">
                <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                  <span id="ota-status-text">Uploading firmware image…</span>
                  <span id="ota-pct-text" class="tabular-nums">0%</span>
                </div>
                <div style="height:8px;background:var(--secondary);border-radius:999px;overflow:hidden">
                  <div id="ota-bar" style="height:100%;width:0%;background:var(--primary);transition:width 150ms"></div>
                </div>
              </div>
              <div>
                <button class="btn btn-primary btn-sm" onclick="simulateOtaUpload()">Install Firmware v1.2.0</button>
              </div>
            </div>

            <!-- Backup & Restore -->
            <div class="card" style="display:flex;flex-direction:column;gap:12px">
              <h3 style="margin:0;font-size:17px">Backup &amp; Restore</h3>
              <p style="margin:0;font-size:13px;color:var(--muted-foreground)">Export versioned LittleFS configuration JSON (excludes NVS secrets by default).</p>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn btn-secondary btn-sm" onclick="showToast('Downloaded lumen-backup-v1.json','success','Excluded NVS credentials')">Download Backup</button>
                <button class="btn btn-secondary btn-sm" onclick="showToast('Schema validation ready','default','Select a backup JSON archive to validate')">Restore JSON</button>
              </div>
            </div>

            <!-- System & Factory Reset (Section 7.11 typed confirmation) -->
            <div class="card" style="display:flex;flex-direction:column;gap:12px">
              <h3 style="margin:0;font-size:17px">System Lifecycle</h3>
              <p style="margin:0;font-size:13px;color:var(--muted-foreground)">Reboot controller or erase LittleFS/NVS back to factory defaults.</p>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn btn-secondary btn-sm" onclick="showToast('Controller restart scheduled','default','Reconnecting in ~4s')">Restart Controller</button>
                <button class="btn btn-destructive btn-sm" onclick="openFactoryResetModal()">Factory Reset</button>
              </div>
            </div>

            <!-- About & Flash Partition Budget (Section 14.1) -->
            <div class="card" style="display:flex;flex-direction:column;gap:8px">
              <h3 style="margin:0;font-size:17px">About Lumen</h3>
              <div style="font-size:13px;display:flex;flex-direction:column;gap:4px">
                <div style="display:flex;justify-content:space-between"><span style="color:var(--muted-foreground)">Firmware</span><span class="font-mono">v1.0.0 (ESP-IDF v5.3)</span></div>
                <div style="display:flex;justify-content:space-between"><span style="color:var(--muted-foreground)">Reference Board</span><span class="font-mono">KinCony KC868-AP</span></div>
                <div style="display:flex;justify-content:space-between"><span style="color:var(--muted-foreground)">LittleFS WebUI Budget</span><span class="tabular-nums">412 KB / 1.0 MB (Gzipped)</span></div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function simulateOtaUpload() {
      const wrap = document.getElementById('ota-progress-wrap');
      const bar = document.getElementById('ota-bar');
      const pct = document.getElementById('ota-pct-text');
      const txt = document.getElementById('ota-status-text');
      if (!wrap) return;
      wrap.style.display = 'block';
      let p = 0;
      const timer = setInterval(() => {
        p += 20;
        if (bar) bar.style.width = `${p}%`;
        if (pct) pct.textContent = `${p}%`;
        if (p === 80 && txt) txt.textContent = 'Verifying image signature & partition…';
        if (p >= 100) {
          clearInterval(timer);
          if (txt) txt.textContent = 'OTA validated — ready to boot slot ota_1';
          state.alerts = state.alerts.filter(a => a.id !== 'ota_avail');
          showToast('OTA v1.2.0 verified & staged', 'success', 'Configuration preserved across upgrade.');
        }
      }, 280);
    }

    function openFactoryResetModal() {
      state.modal = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal-panel">
            <h2 style="margin:0 0 8px;font-size:18px;color:var(--destructive)">Confirm Factory Reset</h2>
            <p style="margin:0 0 12px;font-size:14px;color:var(--muted-foreground)">
              This permanently erases all rooms, scenes, automations, floor plans, and credentials. Type <strong>RESET</strong> to confirm.
            </p>
            <input id="reset-confirm-input" class="input font-mono" placeholder="Type RESET" />
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">
              <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
              <button class="btn btn-destructive" onclick="executeFactoryReset()">Erase &amp; Reset</button>
            </div>
          </div>
        </div>
      `;
      render();
    }

    function executeFactoryReset() {
      const val = document.getElementById('reset-confirm-input')?.value.trim();
      if (val !== 'RESET') {
        showToast('Confirmation required', 'error', 'Please type RESET in all caps.');
        return;
      }
      closeModal();
      showToast('Factory reset initiated', 'default', 'Restoring default admin credentials.');
      navigate('login');
    }

    function closeModal() {
      state.modal = null;
      render();
    }

    // ==========================================================================
    // APP SHELL RENDERER (TopBar, Sidebar, Mobile Drawer, BottomNav, Main)
    // ==========================================================================
    const NAV_CONTROL = [
      { id: 'overview', label: 'Overview', icon: Icons.home },
      { id: 'rooms', label: 'Rooms', icon: Icons.rooms },
      { id: 'floorplans', label: 'Floor Plans', icon: Icons.map },
      { id: 'scenes', label: 'Scenes', icon: Icons.sparkles },
      { id: 'automations', label: 'Automations', icon: Icons.workflow },
      { id: 'devices', label: 'Devices', icon: Icons.lightbulb }
    ];

    const NAV_CONFIGURE = [
      { id: 'hardware', label: 'Hardware', icon: Icons.cpu },
      { id: 'integrations', label: 'Integrations', icon: Icons.share },
      { id: 'network', label: 'Network', icon: Icons.wifi },
      { id: 'settings', label: 'Settings', icon: Icons.settings }
    ];

    function renderNavButtons(items) {
      return items.map(item => `
        <button
          class="nav-item ${state.route === item.id ? 'active' : ''}"
          onclick="navigate('${item.id}')"
          aria-current="${state.route === item.id ? 'page' : 'false'}">
          ${item.icon}
          <span class="nav-label">${item.label}</span>
        </button>
      `).join('');
    }

    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      // Full-screen Auth & First-Run Setup Routes (Section 7.1)
      if (state.route === 'login') {
        root.innerHTML = renderAuthScreen(false);
        return;
      }
      if (state.route === 'setup-password') {
        root.innerHTML = renderAuthScreen(true);
        return;
      }

      let screenHtml = '';
      switch (state.route) {
        case 'overview': screenHtml = renderOverview(); break;
        case 'rooms': screenHtml = renderRooms(); break;
        case 'floorplans': screenHtml = renderFloorPlans(); break;
        case 'scenes': screenHtml = renderScenes(); break;
        case 'automations': screenHtml = renderAutomations(); break;
        case 'devices': screenHtml = renderDevices(); break;
        case 'hardware': screenHtml = renderHardware(); break;
        case 'integrations': screenHtml = renderIntegrations(); break;
        case 'network': screenHtml = renderNetwork(); break;
        case 'settings': screenHtml = renderSettings(); break;
        default: screenHtml = renderOverview();
      }

      root.innerHTML = `
        <div class="app-shell">
          <!-- TopBar (Section 6.1) -->
          <header class="topbar">
            <div class="topbar-left">
              <button class="btn btn-ghost btn-icon" onclick="handleMenuButton()" aria-label="Toggle navigation menu">
                ${Icons.menu}
              </button>
              <a class="brand-logo" onclick="navigate('overview')" tabindex="0">
                <span class="brand-sun">${Icons.sun}</span>
                <span>Lumen</span>
              </a>
              <div class="controller-pill">
                <span>${escapeHtml(state.controllerName)}</span>
              </div>
            </div>

            <div class="topbar-right">
              <!-- Connectivity StatusDot (Click to simulate WebSocket offline/online) -->
              <button
                class="status-dot ${state.wsConnected ? 'online' : 'offline'}"
                onclick="toggleWsSimulation()"
                title="Click to simulate WebSocket disconnect/reconnect"
                aria-label="Controller connectivity status: ${state.wsConnected ? 'Online' : 'Offline'}">
                <span class="dot-indicator"></span>
                <span>${state.wsConnected ? `Online (${state.wsLatencyMs}ms)` : 'Offline'}</span>
              </button>

              <!-- Quick Theme Toggle -->
              <button
                class="btn btn-ghost btn-icon"
                onclick="applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark')"
                aria-label="Toggle light or dark theme">
                ${document.documentElement.classList.contains('dark') ? Icons.sun : Icons.moon}
              </button>

              <!-- Profile Dropdown (Includes Auth Screen Preview Triggers) -->
              <div class="dropdown-wrap">
                <button
                  class="btn btn-secondary btn-sm"
                  onclick="state.profileDropdownOpen=!state.profileDropdownOpen;render()"
                  aria-expanded="${state.profileDropdownOpen}"
                  aria-label="Administrator profile menu">
                  ${Icons.user}
                  <span style="display:none" class="sm-inline">admin</span>
                  ${Icons.chevronDown}
                </button>
                ${state.profileDropdownOpen ? `
                  <div class="dropdown-menu" role="menu">
                    <div style="padding:8px 12px;border-bottom:1px solid var(--border);margin-bottom:4px">
                      <div style="font-weight:600;font-size:13px">admin</div>
                      <div style="font-size:11px;color:var(--muted-foreground)">Single-User Session</div>
                    </div>
                    <button class="dropdown-item" onclick="navigate('login')">${Icons.lock} Preview Login Screen</button>
                    <button class="dropdown-item" onclick="navigate('setup-password')">${Icons.lock} Preview First-Run Password</button>
                    <button class="dropdown-item" onclick="navigate('settings')">${Icons.settings} Controller Settings</button>
                  </div>
                ` : ''}
              </div>
            </div>
          </header>

          <!-- Non-blocking Offline ConnectionBanner (Section 5.2 & 15) -->
          ${!state.wsConnected ? `
            <div class="connection-banner" role="alert">
              <div style="display:flex;align-items:center;gap:8px">
                ${Icons.alert}
                <span><strong>WebSocket Disconnected:</strong> Lighting controls are read-only until connection to <code>/api/v1/ws</code> resumes.</span>
              </div>
              <button class="btn btn-secondary btn-sm" onclick="toggleWsSimulation()">Reconnect Now</button>
            </div>
          ` : ''}

          <div class="shell-body">
            <!-- Desktop & Tablet Rail Sidebar (Section 6.1) -->
            <aside class="sidebar ${state.sidebarCollapsed ? 'collapsed' : ''}" aria-label="Main navigation">
              <div class="nav-group-title">Control</div>
              ${renderNavButtons(NAV_CONTROL)}
              <div class="nav-divider"></div>
              <div class="nav-group-title">Configure</div>
              ${renderNavButtons(NAV_CONFIGURE)}
            </aside>

            <!-- Main Content -->
            <main class="main-content">
              ${screenHtml}
            </main>
          </div>

          <!-- Mobile Bottom Navigation: 4 primary destinations (Section 6.1) -->
          <nav class="bottom-nav" aria-label="Mobile navigation">
            ${[
              { id: 'overview', label: 'Overview', icon: Icons.home },
              { id: 'rooms', label: 'Rooms', icon: Icons.rooms },
              { id: 'scenes', label: 'Scenes', icon: Icons.sparkles },
              { id: 'floorplans', label: 'Floor Plans', icon: Icons.map }
            ].map(item => `
              <button class="bottom-nav-btn ${state.route === item.id ? 'active' : ''}" onclick="navigate('${item.id}')">
                ${item.icon}
                <span>${item.label}</span>
              </button>
            `).join('')}
          </nav>

          <!-- Mobile Slide-Out Drawer Sheet -->
          ${state.mobileDrawerOpen ? `
            <div class="drawer-backdrop" onclick="if(event.target===this){state.mobileDrawerOpen=false;render()}">
              <div class="drawer-panel">
                <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 8px 14px">
                  <div class="brand-logo"><span class="brand-sun">${Icons.sun}</span><span>Lumen</span></div>
                  <button class="btn btn-ghost btn-sm" onclick="state.mobileDrawerOpen=false;render()">✕</button>
                </div>
                <div class="nav-group-title">Control</div>
                ${renderNavButtons(NAV_CONTROL)}
                <div class="nav-divider"></div>
                <div class="nav-group-title">Configure</div>
                ${renderNavButtons(NAV_CONFIGURE)}
              </div>
            </div>
          ` : ''}

          <!-- Active Modal Portal -->
          ${state.modal || ''}
        </div>
      `;
    }

    function handleMenuButton() {
      if (window.innerWidth < 640) {
        state.mobileDrawerOpen = !state.mobileDrawerOpen;
      } else {
        state.sidebarCollapsed = !state.sidebarCollapsed;
      }
      render();
    }

    function toggleWsSimulation() {
      state.wsConnected = !state.wsConnected;
      if (state.wsConnected) {
        showToast('WebSocket reconnected', 'success', 'Reconciled state with controller.');
      } else {
        showToast('Simulated WebSocket disconnect', 'error', 'Controls disabled while offline.');
      }
      render();
    }

    // Close profile dropdown when clicking outside
    document.addEventListener('click', (e) => {
      if (state.profileDropdownOpen && !e.target.closest('.dropdown-wrap')) {
        state.profileDropdownOpen = false;
        render();
      }
    });

    // Subtle simulated live WebSocket telemetry heartbeat
    setInterval(() => {
      if (state.wsConnected && state.route !== 'login' && state.route !== 'setup-password') {
        state.wsLatencyMs = 11 + Math.floor(Math.random() * 7);
      }
    }, 4000);

    // Boot application on load
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
