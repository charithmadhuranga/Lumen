; Lumen — universal ESP32 smart lighting controller.
; Firmware build configuration.
;
; Toolchain is PINNED (AGENTS.md §5): do not upgrade the platform or
; ESP-IDF version without asking. Installed offline: espressif32 8.0.0
; bundling ESP-IDF 6.1.0.

[platformio]
default_envs = esp32
src_dir = src
test_dir = test

[env]
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    -DLUMEN_FIRMWARE_VERSION=\"0.1.0-dev\"
; On-target suites are test_device_*; host-only suites are test_host_*.
; test/fixtures holds JSON fixtures (never a test suite).

; ---------------------------------------------------------------------
; KinCony KC868-AP reference board — the physical test device (ESP32,
; 4 MB flash, CH341 on /dev/ttyUSB1; verified by esptool, MAC 40:22:d8:67:07:98).
; ---------------------------------------------------------------------
[env:esp32]
platform = espressif32@8.0.0
framework = espidf
board = esp32dev
board_build.flash_mode = qio
upload_speed = 921600
; Keep the port explicit so we never flash the wrong board (ttyUSB0
; belongs to another device).
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
test_ignore =
    test_host_*
    fixtures

; Secondary compile target for ESP32-S3 variants (compile-only in Phase 0;
; no upload port is pinned for it).
[env:esp32s3]
platform = espressif32@8.0.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
upload_speed = 921600
test_ignore =
    test_host_*
    fixtures

; Host unit tests for hardware-independent logic (mock drivers).
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DLUMEN_FIRMWARE_VERSION=\"0.1.0-dev\"
    -DLUMEN_REPO_ROOT=\"${platformio.workspace_dir}/..\"
test_ignore =
    test_device_*
    fixtures
