; Lumen — universal ESP32 smart lighting controller.
; Firmware build configuration.
;
; Toolchain is PINNED (AGENTS.md §5): do not upgrade the platform or
; ESP-IDF version without asking. Installed offline: espressif32 8.0.0
; bundling ESP-IDF 6.1.0.

[platformio]
default_envs = esp32
src_dir = src
test_dir = test

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:scripts/pio_secrets.py
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Built-in board profiles compiled into the image (read-only, SPEC §6.1).
; Must match EMBED_TXTFILES in src/CMakeLists.txt.
board_build.embed_txtfiles =
    boards/kincony_kc868_ap.json
    boards/generic_esp32.json
    boards/generic_esp32_pca9685.json
    boards/generic_esp32_pcf8574.json
    boards/generic_esp32_pwm.json
    boards/generic_esp32s3.json
; Host AND on-device tests build the project sources (src/) so suites can
; exercise real modules; suites themselves live in test/<suite>/.
test_build_src = yes
build_flags =
    -DLUMEN_FIRMWARE_VERSION=\"0.1.0-dev\"
; On-target suites are test_device_*; host-only suites are test_host_*.
; test/fixtures holds JSON fixtures (never a test suite).

; ---------------------------------------------------------------------
; KinCony KC868-AP reference board — the physical test device (ESP32,
; 4 MB flash, CH341 on /dev/ttyUSB0; verified by esptool, MAC 40:22:d8:67:07:98).
; ---------------------------------------------------------------------
[env:esp32]
platform = espressif32@8.0.0
framework = espidf
board = esp32dev
board_build.flash_mode = qio
upload_speed = 921600
; Keep the port explicit so we never flash the wrong board.
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
test_ignore =
    test_host_*
    fixtures

; Secondary compile target for ESP32-S3 variants (compile-only in Phase 0;
; no upload port is pinned for it).
[env:esp32s3]
platform = espressif32@8.0.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
upload_speed = 921600
test_ignore =
    test_host_*
    fixtures

; Host unit tests for hardware-independent logic (mock drivers).
[env:native]
platform = native
test_framework = unity
; Build src/ for tests, minus main.cpp (entry point) and ESP-only ports.
build_src_filter = +<*> -<main.cpp> -<core/platform/> -<hardware/platform/> -<hardware/drivers/gpio_driver.cpp> -<hardware/drivers/ledc_driver.cpp> -<hardware/drivers/i2c_manager.cpp> -<hardware/drivers/relay_driver.cpp> -<hardware/drivers/rmt_led_driver.cpp> -<web/> -<networking/network_manager.cpp> -<networking/net_sender.cpp> -<networking/mqtt_service.cpp> -<networking/control_servers.cpp> -<services/platform/> -<app/>
build_flags =
    -std=gnu++17
    -g
    -Wall
    -Wextra
    -I test/unit/mocks
    -DLUMEN_FIRMWARE_VERSION=\"0.1.0-dev\"
    -DLUMEN_REPO_ROOT=\"${platformio.workspace_dir}/..\"
test_ignore =
    test_device_*
    fixtures
