<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Lumen</title>
    <script>
      // Apply the stored theme before first paint (no flash). Keep the key
      // in sync with src/lib/theme.ts; Phase 6 moves it to uiStore (DESIGN §2.1).
      (function () {
        try {
          var mode = localStorage.getItem("lumen-theme") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode / no storage — system theme applies via CSS */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
